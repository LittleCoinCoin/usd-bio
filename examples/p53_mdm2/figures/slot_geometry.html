<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>P-14 slot geometry probe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="/__canons__/conference_assets/library/tokens.css">
<link rel="stylesheet" href="/__canons__/conference_assets/library/components.css">
<style>
  html,body{margin:0;padding:0;background:#6E7076}
  /* zoom 1: measure at true print size, as the @media print branch does */
  .sheet{width:841mm;background:var(--paper);color:var(--ink);
         font-family:var(--font-prose);font-weight:var(--weight-prose);
         padding:20mm;box-sizing:border-box;display:flex;flex-direction:column;gap:10mm}
</style>
</head><body>
<div class="sheet" id="sheet"></div>
<script>
// Card markup copied verbatim from "PRIMe Poster P-14.dc.html"; the only change is
// <image-slot> -> <div class="slot">, which carries the identical inline box.
const TILES = [
  ["mod-text",         "Structured text",           "Biology layer · PDB + .bnd",            null],
  ["mod-units",        "Numbers with units",        "Protocol layer · kcal/mol, Å, amu", null],
  ["fig-composition",  "Three-dimensional geometry","Biology layer · 818 atoms, 834 bonds",  null],
  ["fig-curves",       "Time series",               "Analysis layer · 500 frames",
      '<span style="flex:none;text-align:right;font-size:var(--type-detail);line-height:1.25;color:var(--ink-soft)"><b style="color:var(--accent)">W23A 86 %</b><br>wild type 31 %</span>'],
  ["mod-state",        "Discrete state",            "Perturbation layer · 5 nodes",          null],
  ["mod-display",      "Visual representation",     "Any USD viewer · 4 modes",              null],
];
document.getElementById('sheet').innerHTML = TILES.map(([id,title,sub,extra]) => `
<div style="width:216mm;height:96mm;background:var(--paper);border:var(--rule-weight) solid var(--rule);border-radius:var(--radius);box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden">
  <div style="padding:5mm 7mm 4mm;display:flex;align-items:baseline;justify-content:space-between;gap:6mm">
    <span style="min-width:0">
      <b style="display:block;font-size:var(--type-caption);line-height:1.06">${title}</b>
      <span style="display:block;font-size:var(--type-detail);letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:2mm">${sub}</span>
    </span>
    ${extra || ''}
  </div>
  <div style="min-height:0;background:var(--field);border-top:var(--rule-weight) solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:stretch;overflow:hidden">
    <div class="slot" data-id="${id}" style="width:100%;height:100%;min-width:0;min-height:0"></div>
  </div>
</div>`).join('');

window.SLOTS = () => {
  // 1in = 96 CSS px = 25.4mm, so px -> mm is *25.4/96 at zoom 1.
  const PXMM = 25.4/96;
  return [...document.querySelectorAll('.slot')].map(el => {
    const r = el.getBoundingClientRect();
    const w = r.width*PXMM, h = r.height*PXMM;
    return {id: el.dataset.id, w:+w.toFixed(2), h:+h.toFixed(2), ratio:+(w/h).toFixed(4)};
  });
};
</script>
</body></html>
